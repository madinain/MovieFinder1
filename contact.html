<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact • Movie Finder</title>
  <link rel="stylesheet" href="style.css" />
  <!-- REMOVE script.js from here -->
</head>

<body>
  <header class="site-header">
    <h1>📩 Contact Us</h1>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="team.html">Team</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main class="container">
    <section class="contact-section">
      <h2>Get in Touch</h2>
      <p class="contact-intro">
        Have feedback, feature ideas, or a movie suggestion? Leave us a message below.
      </p>

      <form id="contactForm" class="contact-card" novalidate>
        <div class="form-group">
          <label for="name">Name<span>*</span></label>
          <input type="text" id="name" name="name" placeholder="Your name" />
          <small class="error" id="nameError"></small>
        </div>

        <div class="form-group">
          <label for="email">Email<span>*</span></label>
          <input type="email" id="email" name="email" placeholder="you@example.com" />
          <small class="error" id="emailError"></small>
        </div>

        <div class="form-group">
          <label for="message">Message<span>*</span></label>
          <textarea id="message" name="message" rows="4"
            placeholder="Write your message..."></textarea>
          <small class="error" id="messageError"></small>
        </div>

        <button type="submit" class="btn-cute">Send Message ✨</button>
        <p id="successMessage" class="success-text"></p>
      </form>

      <section id="savedMessages" class="saved-messages hidden">
        <h3>Saved Messages</h3>
        <div id="messagesList"></div>
      </section>
    </section>
  </main>

  <footer class="site-footer">
    <small>VCU INFO 202 • Movie Finder</small>
  </footer>

  <!-- 🔹 Add jQuery + script.js at the BOTTOM, like index.html -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

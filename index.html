<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Movie Finder</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Bootstrap CSS (optional) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body>
  <header class="site-header">
    <h1>🎬 Movie Finder</h1>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="team.html">Team</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="container">
    <section class="search-box">
      <label for="query">Search by title</label>
      <form id="searchForm">
        <input
          id="query"
          name="query"
          type="text"
          placeholder="e.g., Inception"
          required
          aria-label="Movie title"
        />
        <button type="submit">Search</button>
      </form>
      <p id="error" class="error" role="alert" aria-live="polite"></p>
    </section>

    <section id="results" class="results" aria-live="polite">
      <!-- Search results will appear here -->
    </section>
  </main>

  <footer class="site-footer">
  <p>VCU INFO 202 · Movie Finder</p>
  <p class="project-description">
    Movie Finder is an INFO 202 team project that lets users search movies by title
    using real-time data from an online movie database.
  </p>
</footer>
  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- JS file (AJAX logic) -->
  <script src="script.js"></script>

  <!-- Bootstrap JS (optional) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
